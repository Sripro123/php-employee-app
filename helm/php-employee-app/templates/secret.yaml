{{- if .Values.mysql.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ required "Set mysql.rootPassword" .Values.mysql.rootPassword | quote }}
  MYSQL_DATABASE: {{ .Values.mysql.database | quote }}
  MYSQL_USER: {{ .Values.mysql.username | quote }}
  MYSQL_PASSWORD: {{ required "Set mysql.password" .Values.mysql.password | quote }}
{{- end }}
